apiVersion: v1
kind: Service
metadata:
  name: {{ include "recipe-finder.name" . }}
  labels:
    {{- include "recipe-finder.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "recipe-finder.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
