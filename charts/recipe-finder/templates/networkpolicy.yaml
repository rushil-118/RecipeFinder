{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "recipe-finder.name" . }}
  labels:
    {{- include "recipe-finder.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "recipe-finder.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
  egress: []
{{- end }}
