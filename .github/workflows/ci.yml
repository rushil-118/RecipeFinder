name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Reject committed secrets
        run: bash scripts/check-secrets.sh
      - run: ruff check .
      - name: Run tests with coverage
        run: PYTHONPATH=. python -m pytest -q --cov=recipefinder --cov-fail-under=85
      - name: Lint the Helm chart
        run: helm lint charts/recipe-finder --set image.tag=ci

  deploy:
    needs: check
    uses: ./.github/workflows/cd.yml